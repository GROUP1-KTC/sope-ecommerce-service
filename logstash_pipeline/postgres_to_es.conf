input {
    jdbc {
        jdbc_driver_library => "/usr/share/java/postgresql-42.6.0.jar"
        jdbc_driver_class => "org.postgresql.Driver"
        jdbc_connection_string => "jdbc:postgresql://host.docker.internal:5432/sope?sslmode=disable"
        jdbc_user => "postgres"
        jdbc_password => "postgres123"
        jdbc_paging_enabled => true
        tracking_column => "unix_ts_in_secs"
        use_column_value => true
        tracking_column_type => "numeric"
        schedule => "* * * * *"

        statement => "
                        SELECT 
                            p.product_id, 
                            p.name, 
                            p.default_image, 
                            p.slug,
                            c.id AS category_id,      
                            c.name AS category_name,
                            MIN(pv.price) AS min_price,
                            COALESCE(SUM(pv.sold),0) AS total_sold,
                            COUNT(DISTINCT r.review_id) AS review_count,
                            CASE 
                                WHEN COUNT(r.review_id) > 0 
                                THEN (SUM(r.rating)::decimal / (COUNT(r.review_id) * 5)) 
                                ELSE 0 
                            END AS rating_score,
                            extract(epoch from p.created_at) AS unix_ts_in_secs
                        FROM products p
                        LEFT JOIN categories c ON p.category_id = c.id
                        LEFT JOIN product_variants pv ON p.product_id = pv.product_id
                        LEFT JOIN reviews r ON pv.product_variant_id = r.product_variant_id
                        GROUP BY 
                            p.product_id, p.name, p.default_image, p.slug, p.created_at, 
                            c.id, c.name
                    "
    }
}

filter {
  mutate {
    copy => { "product_id" => "[@metadata][_id]" }
    remove_field => ["@version", "@timestamp"]
  }
}

output {
    elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "products_index"
        document_id => "%{[@metadata][_id]}"
    }
    stdout { codec => rubydebug }
}
