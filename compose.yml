services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      sope-ecommerce-backend-network:
        aliases:
          - 18.141.145.133   # alias trực tiếp cho redis container

  api-product:
    image: ${DOCKER_IMAGE_SON}:${DOCKER_TAG}
    container_name: ${DOCKER_CONTAINER}
    env_file:
      - .env
    ports:
      - "${SERV_PORT}:${SERV_PORT}"
    networks:
      - sope-ecommerce-backend-network

networks:
  sope-ecommerce-backend-network:
    external: true
