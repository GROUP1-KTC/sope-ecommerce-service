services:
  postgres:
    image: postgres:latest
    container_name: sope-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: sope
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sope-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: my-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: postgres123
    ports:
      - "8081:80"
    depends_on:
      - postgres

  redis:
    image: redis:latest
    container_name: sope-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - sope-network
    volumes:
      - redis_data:/data


  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    ports:
      - "7880:7880" # REST API
      - "7881:7881" # gRPC / Admin
      - "5349:5349/udp" # TURN (UDP)
      - "7882:7882" # WebRTC
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_REGION: local
      LIVEKIT_LOG_LEVEL: info

    volumes:
      - ./livekit-data:/data
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --udp-port
      - "5349"
      - --node-ip
      - ${NODE_IP:-10.19.82.225}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sope-network


  elasticsearch:
    image: elasticsearch:7.9.2
    container_name: sope-elasticsearch
    environment:
      - discovery.type=single-node
      - http.cors.enabled=true
      - http.cors.allow-origin=*
      - http.cors.allow-headers=Authorization,Content-Type,Origin,Accept
      - http.cors.allow-credentials=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always
    networks:
      - sope-network



  logstash:
    image: logstash:7.9.2
    container_name: sope-logstash
    depends_on:
      - elasticsearch
      - postgres
    ports:
      - "5000:5000"
    volumes:
      - /Users/mac/Works/sope-main/sope-ecommerce-service/lib/postgresql-42.6.0.jar:/usr/share/java/postgresql-42.6.0.jar
      - /Users/mac/Works/sope-main/sope-ecommerce-service/logstash_pipeline:/usr/share/logstash/pipeline
      - type: bind
        source: ./logstash_pipeline/
        target: /usr/share/logstash/pipeline
        read_only: true
    restart: always
    networks:
      - sope-network


