spring:
    application:
        name: sope ecommerce backend

    mail:
        host: ${EMAIL_HOST}
        port: ${EMAIL_PORT}
        username: ${EMAIL}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    thymeleaf:
        prefix: classpath:/templates/
        suffix: .html
        mode: HTML
        cache: false

    ai:
        openai:
            api-key: ${GEMINI_KEY}
            chat:
                base-url: ${GEMINI_BASED_URL}
                completions-path: /v1beta/openai/chat/completions
                options:
                    model: ${GEMINI_MODEL}

    datasource:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?TimeZone=Asia/Ho_Chi_Minh
        username: ${DB_USER}
        password: ${DB_PASS}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        properties:
            hibernate:
                format_sql: true
                jdbc:
                    time_zone: Asia/Ho_Chi_Minh

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASS}
            username: ${REDIS_USER}
            database: 0
            timeout: 2s
            lettuce:
                pool:
                    max-total: 100
                    max-idle: 50
                    min-idle: 10
                    max-wait: 1s
            cluster:
                nodes:

    cache:
        type: redis
        redis:
            default-ttl: 10m
            cache-ttls:
                users: 5m
                products: 30m
                GOSHIP_ADDRESSES: 30d

    jackson:
        polymorphic:
            package: com.sope.sope_ecommerce_backend.model.

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1.0
        default-schema: public
        schemas: public
        locations: classpath:db/migration
        table: flyway_schema_history

    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 20MB

cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: Content-Type, Authorization, X-Requested-With
    exposed-headers: Content-Disposition
    allow-credentials: true
    max-age: 3600

server:
    port: 8080
    servlet:
        context-path: /api/v1
    tomcat:
        max-part-count: 50
        max-part-header-size: 2048

jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    expiration: ${JWT_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}

payment-gateway:
    vnpay:
        pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
        secret-key: ${VNPAY_SECRET_KEY}
        api-url:
        return-url: ${VNPAY_RETURN_URL}
        vnp-version: 2.1.0
        vnp-command: pay
        vnp_tmn-code: 2QXUI4J4

    momo:
        partner-code: ${MOMO_PARTNER_CODE}
        endpoint: https://test-payment.momo.vn/v2/gateway/api
        return-url: ${MOMO_RETURN_URL}
        ipn-url: ${MOMO_IPN_URL}
        access-key: ${MOMO_ACCESS_KEY}
        secret-key: ${MOMO_SECRET_KEY}
        request-type: captureWallet

cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

web:
    cors:
        allowed-origins: ${ALLOWED_ORIGINS}
        allowed-methods:
            - GET
            - POST
            - PATCH
            - PUT
            - DELETE
            - OPTIONS
        allowed-headers: "*"
        exposed-headers:
            - "Authorization"
        allow-credentials: true
        max-age: 3600

shipping-unit:
    goship:
        base-url: https://sandbox.goship.io/api/v2
        auth-token: ${GOSHIP_AUTH_TOKEN}
        client-id: 200
        client-secret: ${GOSHIP_CLIENT_SECRET}

ai-service: url:${AI_SERVICE_URL}

livekit:
    url: ${LIVEKIT_URL}
    api:
        key: ${LIVEKIT_API_KEY}
        secret: ${LIVEKIT_API_SECRET}
