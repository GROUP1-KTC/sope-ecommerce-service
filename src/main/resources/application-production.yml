spring:
  application:
    name: sope ecommerce backend

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java


  datasource:
    url: jdbc:postgresql://postgres:5432/sope
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  cache:
    type: redis
    redis:
      default-ttl: 600 # 10 minutes
      cache-ttls:
        users: 300 # 5 minutes
        products: 1800 # 30 minutes

  redis:
    host: redis
    port: 6379
    database: 0
    timeout: 10s
    lettuce:
      shutdown-timeout: 100ms
      pool:
        max-total: 100
        max-idle: 50
        min-idle: 10
        max-wait: 1s
        test-on-borrow: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1.0
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    table: flyway_schema_history

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: '284dd6c8bceeacfa2559a1ca7ef3e4c25099bea3d6a7f3e9cb2470e39a46106f1379b3b61aedbaf5299126211f663aef6c79aac2fc3913752b5ae63e06c7a592='
    header: Authorization
    prefix: Bearer
    expires-in-minutes: 60
    refresh-expires-in-days: 14
    clock-skew-second: 60
    rotate-on-refresh: true
    reuse-detection: true
    expiration: 900000
    refresh-expiration: 604800000
  refresh-token:
    enabled: true
    header: X-Refresh-Token
    prefix: Refresh
    expires-in-minutes: 60
    clock-skew-second: 60

  security:
    user:
    name: user
    password: password
    oauth2:
    client:
      registration:
      google:
        client-id: your-google-client-id
        client-secret: your-google-client-secret
        scope: profile, email

cors:
  allowed-origins: "*"
  allowed-methods: GET, POST, PUT, DELETE, OPTIONS
  allowed-headers: Content-Type, Authorization, X-Requested-With
  exposed-headers: Content-Disposition
  allow-credentials: true
  max-age: 3600

logging:
  level:
    org:
      springframework:
        web: DEBUG
        security: DEBUG
    org.springframework.data.redis: DEBUG
    io:
      lettuce:
        core=DEBUG:

