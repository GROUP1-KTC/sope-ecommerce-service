spring:
    application:
        name: sope ecommerce backend

    config:
        import: optional:file:.env[.properties]

    mail:
        host: ${EMAIL_HOST}
        port: 587
        username: ${EMAIL}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    thymeleaf:
        prefix: classpath:/templates/
        suffix: .html
        mode: HTML
        cache: false

    devtools:
        restart:
            enabled: true
            additional-paths: src/main/java
    ai:
        openai:
            api-key: ${GEMINI_KEY}
            chat:
                base-url: https://generativelanguage.googleapis.com
                completions-path: /v1beta/openai/chat/completions
                options:
                    model: gemini-2.0-flash

    datasource:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?TimeZone=Asia/Ho_Chi_Minh
        username: ${DB_USER}
        password: ${DB_PASS}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        properties:
            hibernate:
                format_sql: true
                jdbc:
                    time_zone: Asia/Ho_Chi_Minh

    data:
        redis:
            host: localhost
            port: 6379
            password:
            database: 0
            timeout: 2s
            lettuce:
                pool:
                    max-total: 100
                    max-idle: 50
                    min-idle: 10
                    max-wait: 1s
            cluster:
                nodes:

    cache:
        type: redis
        redis:
            default-ttl: 10m
            cache-ttls:
                users: 5m
                products: 30m
                GOSHIP_ADDRESSES: 7d

    jackson:
        polymorphic:
            package: com.sope.sope_ecommerce_backend.model.

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1.0
        default-schema: public
        schemas: public
        locations: classpath:db/migration
        table: flyway_schema_history

    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 20MB

app:
    base-url: https://sope.site

cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: Content-Type, Authorization, X-Requested-With
    exposed-headers: Content-Disposition
    allow-credentials: true
    max-age: 3600

logging:
    level:
        org:
            springframework:
                web: DEBUG
                security: DEBUG
        org.springframework.data.redis: DEBUG
        io:
            lettuce:
                core=DEBUG:
        feign:
            Logger: DEBUG

server:
    port: 8082
    address: 0.0.0.0
    servlet:
        context-path: /api/v1
    tomcat:
        max-part-count: 50
        max-part-header-size: 2048

jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    expiration: ${JWT_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}

