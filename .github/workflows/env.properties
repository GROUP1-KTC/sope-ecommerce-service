- name: Create env.properties
  run: |
    mkdir -p src/main/resources
    cat <<EOF > src/main/resources/env.properties
jwt.private-key=${{ secrets.JWT_PRIVATE_KEY }}
jwt.public-key=${{ secrets.JWT_PUBLIC_KEY }}
jwt.expiration=${{ secrets.JWT_EXPIRATION }}
jwt.refresh-expiration=${{ secrets.JWT_REFRESH_EXPIRATION }}
DB_URL=${{ secrets.DB_URL }}
DB_USER=${{ secrets.DB_USER }}
DB_PASS=${{ secrets.DB_PASS }}
EOF
