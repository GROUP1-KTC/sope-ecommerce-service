name: CI/CD pipeline for Backend Service

on:
  push:
    branches: [main, feature/implement-order-managerment]

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
  DOCKER_TAG: ${{ vars.DOCKER_TAG }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}

jobs:
  build-and-push:
    name: Build Backend Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build --no-cache -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}


      - name: Ensure remote dir exists
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy necessary files to server EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yaml
          target: ${{ env.DEPLOY_DIR }}

      - name: Copy .env file to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > ${{ env.DEPLOY_DIR }}/.env << EOF
            JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}
            JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
        
            DOCKER_IMAGE=${{ vars.DOCKER_IMAGE }}
            DOCKER_TAG=${{ vars.DOCKER_TAG }}
            EOF
            chmod 600 ${{ env.DEPLOY_DIR }}/.env

#  test:
#    name: Run Tests
#    runs-on: ubuntu-latest
#    needs: build
#
#    steps:
#      - name: Checkout Code
#        uses: actions/checkout@v4
#
#      - name: Run Unit & Integration Tests
#        run: |
#          ./gradlew clean test

  deploy:
    name: Deploy Backend Service
    runs-on: ubuntu-latest
    needs: ["build-and-push"]

    steps:
      - name: Deploy Backend Service to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Moving to dir to deployment..."
            cd $DEPLOY_DIR
            
            echo "Creating network (if not exists)..."
            echo "Currently, we re-use ${{ env.DOCKER_NETWORK }}"
            docker network create ${{ env.DOCKER_NETWORK }} || true

            echo "Stopping old container if exists..."
            docker compose -f docker-compose.yaml stop ${{ env.SERVICE_NAME }} || true
            docker compose -f docker-compose.yaml rm -f ${{ env.SERVICE_NAME }} || true
            
            
            echo "Pulling latest image..."
            docker compose -f docker-compose.yaml pull ${{ env.SERVICE_NAME }} || true
            
            echo "Starting new container with correct name..."
            docker compose -f docker-compose.yaml up -d --remove-orphans --build ${{ env.SERVICE_NAME }}
            
            echo "Deployment completed!"