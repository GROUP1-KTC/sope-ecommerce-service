name: CI/CD pipeline for Backend Service

on:
  push:
    branches: [main, feature/implement-order-managerment]

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
  DOCKER_TAG: ${{ vars.DOCKER_TAG }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}

jobs:
  build-and-push:
    name: Build Backend Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
#        run: |
#          docker build --no-cache -t $DOCKER_IMAGE:$DOCKER_TAG .
#          docker push $DOCKER_IMAGE:$DOCKER_TAG

        run: |
          docker buildx build \
          --platform linux/amd64 \
          --no-cache \
          -t $DOCKER_IMAGE:$DOCKER_TAG \
          --push .

      - name: Copy necessary files to server EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yaml"
          target: $DEPLOY_DIR

#  test:
#    name: Run Tests
#    runs-on: ubuntu-latest
#    needs: build
#
#    steps:
#      - name: Checkout Code
#        uses: actions/checkout@v4
#
#      - name: Run Unit & Integration Tests
#        run: |
#          ./gradlew clean test

  deploy:
    name: Deploy Backend Service
    runs-on: ubuntu-latest
    needs: ["build-and-push"]

    steps:
      - name: Deploy Backend Service to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Moving to dir to deployment..."
            cd $DEPLOY_DIR
            
            echo "Creating network (if not exists)..."
            echo "Currently, we re-use $DOCKER_NETWORK"
            docker network create $DOCKER_NETWORK || true

            echo "Stopping old container if exists..."
            docker compose -f docker-compose.yaml stop $SERVICE_NAME || true
            docker compose -f docker-compose.yaml rm -f $SERVICE_NAME || true
            
            
            echo "Pulling latest image..."
            docker compose -f docker-compose.yaml pull $SERVICE_NAME || true
            
            echo "Starting new container with correct name..."
            docker compose -f docker-compose.yaml up -d --remove-orphans --build $SERVICE_NAME
            
            echo "Deployment completed!"