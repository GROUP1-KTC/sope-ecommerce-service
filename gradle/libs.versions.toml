[versions]
# Core
spring-boot = "3.5.3"
spring-dependency-management = "1.1.7"
java = "17"

# Spring Modules
spring-websocket = "6.1.14"
spring-messaging = "6.1.14"
springdoc-openapi = "2.8.9"
spring-cloud = "2025.0.0"


# Database
postgresql = "42.7.4" # PostgreSQL JDBC Driver (check version phù hợp)
spring-data-redis = "3.2.4" # Tự động match Spring Boot
commons-pool2 = "2.12.1"

# Utils
lombok = "1.18.34"
cloudinary = "1.39.0"
slugify = "3.0.6"

# JWT
jjwt = "0.12.6"


# MapStruct
mapstruct = "1.6.3"
lombokMapstructBinding = "0.2.0"

# Flyway
flyway = "11.11.0"



# Test
junit-platform-launcher = "1.11.3"

[libraries]

# Spring Boot Starters
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# Spring Modules
spring-websocket = { module = "org.springframework:spring-websocket", version.ref = "spring-websocket" }
spring-messaging = { module = "org.springframework:spring-messaging", version.ref = "spring-messaging" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
spring-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }

# Database & Connection Pool
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
commons-pool2 = { module = "org.apache.commons:commons-pool2", version.ref = "commons-pool2" }

# Utilities
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
cloudinary = { module = "com.cloudinary:cloudinary-http44", version.ref = "cloudinary" }
slugify = { module = "com.github.slugify:slugify", version.ref = "slugify" }

# JWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
jjwt-bom = { module = "io.jsonwebtoken:jjwt", version.ref = "jjwt" }

# MapStruct
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }


# Flyway
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Test Runtime
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
mockito = { module = "org.mockito:mockito-junit-jupiter" }
h2database = { module = "com.h2database:h2" }


# FeignClient

spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }